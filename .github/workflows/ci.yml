name: CI

# Lint, tipos, tests y build en cada push y PR. No necesita secrets: los tests
# usan fixtures sintéticos y simulan Google y las fuentes externas, y el build
# compila sin el Sheet (la página principal muestra su error de carga).
#
# El build está acá porque las ramas de Dependabot no generan preview en
# Vercel (vercel.json): una versión mayor que rompe el build se ve en este
# check del PR, sin mandar mails de deploy fallido.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
